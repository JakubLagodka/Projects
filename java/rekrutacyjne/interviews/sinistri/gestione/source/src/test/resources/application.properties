#Test database
SINISTRO_PERSISTENCE_DATASOURCE_URL=jdbc:h2:./target/testH2DB;
SINISTRO_PERSISTENCE_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
SINISTRO_PERSISTENCE_DATASOURCE_USERNAME=sa
SINISTRO_PERSISTENCE_DATASOURCE_PASSWORD=sa
HIBERNATE_DIALECT=org.hibernate.dialect.H2Dialect
ENABLE_TEST_ENDPOINTS=true
spring.security.oauth2.resourceserver.jwt.public-key-location=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLIC_KEY_LOCATION:classpath:certs/dev_certificate_publickey.pem}
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true

#Test properties
TEST_REQUEST_DATE=2020-01-01T12:13:14
TEST_APPLICATION_HEADER=test-application-header
TEST_REQUEST_ID=request_id

#monitoring settings ([team]-[applicazione]-[ambiente]-[componente])
APMENV_INTROSCOPE_AGENT_HOSTNAME=crmo-sinistri-dev-gestione
GC_MAX_METASPACE_SIZE=180

DB_POOL_SIZE=200
sinistro.datasource.maximum-pool-size=${DB_POOL_SIZE}