#Test database
SINISTRO_PERSISTENCE_DATASOURCE_URL=jdbc:h2:./target/testH2DB;AUTO_SERVER=TRUE
SINISTRO_PERSISTENCE_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
SINISTRO_PERSISTENCE_DATASOURCE_USERNAME=sa
SINISTRO_PERSISTENCE_DATASOURCE_PASSWORD=sa
HIBERNATE_DIALECT=org.hibernate.dialect.H2Dialect

#additional SQL logging for tests
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

sinistro.datasource.maximumPoolSize=30
sinistro.datasource.keepaliveTime=30000
#sinistro.datasource.idleTimeout=0
sinistro.datasource.connectionTimeout=500000