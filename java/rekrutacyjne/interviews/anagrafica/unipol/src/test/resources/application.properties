TEST_REQUEST_ID=request_id

#monitoring settings ([team]-[applicazione]-[ambiente]-[componente])
APMENV_INTROSCOPE_AGENT_HOSTNAME=crmo-anagrafica-dev-gestione
GC_MAX_METASPACE_SIZE=180

DB_POOL_SIZE=200
anagrafica.datasource.maximum-pool-size=${DB_POOL_SIZE}

STS_URL=https://mpgw-eur.servizi.gr-u.it
STS_PATH=/sts/v1/token
STS_PROVIDE_TYPE=BASIC
STS_PROVIDE_DOMAIN=AD
STS_REQUIRE_TYPE=JWT
