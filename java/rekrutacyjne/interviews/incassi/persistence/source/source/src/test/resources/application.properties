#Test database
CONTABILITA_PERSISTENCE_DATASOURCE_URL=jdbc:h2:./target/testH2DB;AUTO_SERVER=TRUE
CONTABILITA_PERSISTENCE_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
CONTABILITA_PERSISTENCE_DATASOURCE_USERNAME=sa
CONTABILITA_PERSISTENCE_DATASOURCE_PASSWORD=sa
HIBERNATE_DIALECT=org.hibernate.dialect.H2Dialect

#additional SQL logging for tests
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

contabilita.datasource.maximumPoolSize=100
contabilita.datasource.keepaliveTime=30000
#contabilita.datasource.idleTimeout=0
contabilita.datasource.connectionTimeout=500000